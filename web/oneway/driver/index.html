<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="description" content="One Way — Central NJ airport rides. Reserve ahead with the fare shown." />
  <title>One Way · Driver · Central NJ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="../img/favicon.ico?v=20261105b" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="../img/favicon-16.png?v=20261105b" />
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png?v=20261105b" />
  <link rel="apple-touch-icon" sizes="180x180" href="../img/apple-touch-icon.png?v=20261105b" />
  <meta property="og:title" content="One Way · Driver · Central NJ" />
  <meta property="og:description" content="One Way — Central NJ airport rides. Reserve ahead with the fare shown." />
  <meta property="og:image" content="https://robotkitchen.us/demo/web/oneway/img/og-image.png?v=20261105b" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <link rel="preload" as="image" href="../img/marble.jpg?v=20261105b" />
  <link rel="stylesheet" href="../css/app.css?v=20261105b" />
</head>
<body class="driver">
  <div class="app-shell">
    <header class="topbar">
      <a class="logo" href="../" aria-label="One Way">
        <img src="../img/mark.png?v=20261105b" width="40" height="40" alt="" />
        <span>
          <div class="brand-name">ONE WAY</div>
          <div class="brand-sub" data-i18n="brandSubDriver"></div>
        </span>
      </a>
      <div class="topbar-actions">
        <div class="lang-toggle" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="zh">中文</button></div>
        <a class="chip-link" href="../" data-i18n="toRider"></a>
      </div>
    </header>
    <div class="logo-wrap logo-wrap-sm"><span class="full-logo ow-hero" role="img" aria-label="One Way · Airport Rides"><img class="ow-car" src="../img/car.png?v=20261105b" width="1157" height="546" alt="" /><img class="ow-word" src="../img/wordmark.png?v=20261105b" alt="" /></span></div>
    <nav class="drv-tabs drv-tabs-3" role="tablist">
      <button type="button" role="tab" class="drv-tab active" data-tab="schedule" data-i18n="tabSchedule"></button>
      <button type="button" role="tab" class="drv-tab" data-tab="customers" data-i18n="tabCustomers"></button>
      <button type="button" role="tab" class="drv-tab" data-tab="live" data-i18n="tabLive"></button>
    </nav>
    <div class="driver-body" id="tab-schedule">
      <form class="request-card login-card" id="login-card" hidden autocomplete="off">
        <h2 class="gold-text" data-i18n="login"></h2>
        <div class="field">
          <label for="pin" data-i18n="pinLabel"></label>
          <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="current-password" data-i18n-ph="pinPh" />
        </div>
        <button type="submit" class="btn btn-primary" id="btn-login" data-i18n="signIn"></button>
        <div class="fare-error" id="login-err" hidden></div>
      </form>
      <div id="sched-area" hidden>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px">
          <h1 class="gold-text" style="margin:0;font-family:var(--font-display);font-size:1.35rem" data-i18n="tabSchedule"></h1>
          <div style="display:flex;gap:6px">
            <button type="button" class="btn btn-secondary btn-sm" id="btn-sched-refresh" data-i18n="refresh"></button>
            <button type="button" class="btn btn-ghost btn-sm" id="btn-logout" data-i18n="signOut"></button>
          </div>
        </div>
        <label class="pax-note" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="show-past" /> <span data-i18n="showPast"></span></label>
        <div id="sched-list"></div>
      </div>
    </div>
    <div class="driver-body" id="tab-customers" hidden>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px">
        <h1 class="gold-text" style="margin:0;font-family:var(--font-display);font-size:1.35rem" data-i18n="tabCustomers"></h1>
        <button type="button" class="btn btn-secondary btn-sm" id="btn-cust-refresh" data-i18n="refresh"></button>
      </div>
      <div id="cust-list"></div>
    </div>
    <div class="driver-body" id="tab-live" hidden>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px">
        <h1 class="gold-text" style="margin:0;font-family:var(--font-display);font-size:1.35rem" data-i18n="incoming"></h1>
        <button type="button" class="btn btn-secondary" id="btn-refresh" style="width:auto;padding:8px 12px;font-size:13px" data-i18n="refresh"></button>
      </div>
      <div id="request-area">
        <div class="empty-state" id="empty" data-i18n="noRequests"></div>
      </div>
      <button type="button" class="btn btn-ghost" id="btn-sample" style="margin-top:12px" data-i18n="loadSample"></button>
      <div id="active-area" class="hidden" style="margin-top:16px">
        <h2 class="gold-text" style="font-family:var(--font-display);font-size:1.1rem;margin:0 0 8px" data-i18n="activeTrip"></h2>
        <div class="status-pills" id="status-pills">
          <span class="status-pill" data-s="accepted" data-i18n="stAccepted"></span>
          <span class="status-pill" data-s="en_route" data-i18n="stEnRoute"></span>
          <span class="status-pill" data-s="arrived" data-i18n="stArrived"></span>
          <span class="status-pill" data-s="on_trip" data-i18n="stOnTrip"></span>
          <span class="status-pill" data-s="completed" data-i18n="stDone"></span>
        </div>
        <div class="btn-row" style="margin-bottom:8px">
          <button type="button" class="btn btn-secondary" id="btn-next-status" data-i18n="nextStatus"></button>
          <button type="button" class="btn btn-danger" id="btn-clear" data-i18n="clear"></button>
        </div>
      </div>
    </div>
    <p class="footer-note"><span data-i18n="homeNote"></span><br /><a href="https://robotkitchen.us">robotkitchen.us</a></p>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="../js/driver.js?v=20261106lang" type="module"></script>
</body>
</html>
